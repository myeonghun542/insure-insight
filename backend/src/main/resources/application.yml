spring:
  application:
    name: insure-insight-api
  profiles:
    default: local
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:insure_user}
    password: ${ORACLE_PASSWORD:change-me}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.insureinsight
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
